<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Album Cantikku 💕</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff0f5;--ink:#5a2a41;--pink:#ff7eb3;--paper:#fff;--soft:#ffd6e7;--mint:#c9f2e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--ink:#ffe3ee;--pink:#ff8fbd;--paper:#3d2230;--soft:#5a2f45;--mint:#2f5a4a}}
:root[data-theme="dark"]{--bg:#2a1620;--ink:#ffe3ee;--pink:#ff8fbd;--paper:#3d2230;--soft:#5a2f45;--mint:#2f5a4a}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Quicksand',system-ui,sans-serif;font-weight:500;background-image:radial-gradient(var(--soft) 2px,transparent 2px);background-size:26px 26px;overflow-x:hidden}
header{text-align:center;padding:48px 20px 20px}
h1{font-family:'Pacifico',cursive,serif;font-weight:400;font-size:clamp(2.2rem,9vw,4rem);margin:0;color:var(--pink);text-shadow:3px 3px 0 var(--soft)}
header p{max-width:30ch;margin:12px auto 0;font-size:1.05rem}
.bear{display:inline-block;font-size:3rem;animation:b 1.6s ease-in-out infinite}
@keyframes b{50%{transform:translateY(-10px) rotate(6deg)}}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 26px;max-width:1000px;margin:0 auto;padding:30px 22px 20px}
figure{position:relative;margin:0;background:var(--paper);padding:12px 12px 8px;border-radius:6px;box-shadow:0 6px 16px rgba(255,126,179,.28);transform:rotate(var(--r));transition:transform .25s;cursor:pointer}
figure:hover,figure:focus-visible{transform:rotate(0) scale(1.05);z-index:2}
figure img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:3px;background:var(--soft)}
figcaption{font-family:'Pacifico',cursive,serif;text-align:center;padding:10px 4px 4px;color:var(--pink);font-size:.95rem}
.tape{position:absolute;top:-10px;left:50%;width:70px;height:22px;margin-left:-35px;background:var(--mint);opacity:.85;transform:rotate(-4deg);border-radius:2px}
.note{max-width:460px;margin:30px auto 60px;padding:26px;background:var(--paper);border:3px dashed var(--pink);border-radius:22px;text-align:center;line-height:1.6}
.note h2{font-family:'Pacifico',cursive,serif;font-weight:400;color:var(--pink);margin:0 0 8px}
#lb{position:fixed;inset:0;background:rgba(40,10,25,.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;padding:20px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:78vh;border:8px solid #fff;border-radius:8px}
#lb p{color:#fff;font-family:'Pacifico',cursive,serif;font-size:1.2rem;margin:14px 0 0}
.h{position:fixed;bottom:-30px;pointer-events:none;animation:up linear forwards;z-index:1}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.bear{animation:none}.h{display:none}}
</style></head><body>
